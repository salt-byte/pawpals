<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>PawPals</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "SF Pro Text", "PingFang SC", sans-serif;
        background: #f7efe6;
        color: #8a6759;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }
      .loader {
        width: 32px; height: 32px;
        border: 3px solid #ecdccf;
        border-top-color: #f5aa3c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .text { font-size: 14px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <div class="text">PawPals 正在启动...</div>
  </body>
</html>
